version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: devbelt-db-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: devbelt_db
      # server 以 dbclient 身份连接，必须让镜像把这个用户创建出来，
      # 否则启动即认证失败。官方镜像会自动授予该用户 MYSQL_DATABASE 的全部权限，
      # 因此 ensureDatabase() 也不再需要建库权限。
      # 注意：仅在首次初始化空数据目录时生效，已有 mysql-data 卷需手工建用户，
      # 见 README「启动」小节。
      MYSQL_USER: dbclient
      MYSQL_PASSWORD: ${DEVBELT_DB_MYSQL_PASSWORD:?DEVBELT_DB_MYSQL_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: devbelt-db-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DEVBELT_DB_MYSQL_HOST: mysql
      DEVBELT_DB_MYSQL_PORT: 3306
      DEVBELT_DB_MYSQL_USER: dbclient
      DEVBELT_DB_MYSQL_PASSWORD: ${DEVBELT_DB_MYSQL_PASSWORD:?DEVBELT_DB_MYSQL_PASSWORD is required}
      DEVBELT_DB_MYSQL_DATABASE: devbelt_db
      # Ed25519 签名密钥（实施规格 §5.1）。`:?` 让缺失在 compose
      # 阶段就失败，而不是留到运行时。DEVBELT_DB_TOKEN_VERIFY_KEYS_JSON 需包含
      # DEVBELT_DB_TOKEN_SIGNING_KID 对应的公钥。见 .env.example 的生成命令。
      DEVBELT_DB_TOKEN_SIGNING_KEY_B64: ${DEVBELT_DB_TOKEN_SIGNING_KEY_B64:?DEVBELT_DB_TOKEN_SIGNING_KEY_B64 is required}
      DEVBELT_DB_TOKEN_VERIFY_KEYS_JSON: ${DEVBELT_DB_TOKEN_VERIFY_KEYS_JSON:?DEVBELT_DB_TOKEN_VERIFY_KEYS_JSON is required}
      DEVBELT_DB_PORT: 3000
      # 容器内需绑 0.0.0.0 才能接受端口映射；未经过反向代理，故显式关闭 DEVBELT_DB_TRUST_PROXY，
      # 否则服务会拒绝以非回环地址启动（防 XFF 伪造）。
      DEVBELT_DB_HOST: 0.0.0.0
      DEVBELT_DB_TRUST_PROXY: "false"
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  mysql-data: