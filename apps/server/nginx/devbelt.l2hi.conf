# devbelt.l2hi.com —— 开发者套件（单部署单库）。
#
# 当前（P1）server 托管全部 UI（身份页 /login、/verify-email、
# /sync-reset 与控制台 /db/）及全部 API（/api/auth、/api/console、/api/db），
# 因此根路径整体反代到 :3000。P2/P3 拆分前端（套件首页、/db 控制台、/admin 后台）后，
# 再由 nginx 直接托管各 SPA 静态、仅 /api/ 反代。
#
# 应用：sudo cp 到 /etc/nginx/l2hi/devbelt.l2hi.conf 后 nginx -t && systemctl reload nginx。
# 证书：/root/.acme.sh/l2hi.com_ecc（SAN 含 l2hi.com / devbelt.l2hi.com / www.l2hi.com）。
# 注意：证书续期后需 reload nginx，否则仍持旧证书（曾出现 devbelt SAN 不匹配）。

upstream devbelt_db_server {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name devbelt.l2hi.com;

    # ACME HTTP-01 验证：不走 301
    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/l2h/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name devbelt.l2hi.com;

    ssl_certificate     /root/.acme.sh/l2hi.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/l2hi.com_ecc/l2hi.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100m;
    server_tokens off;

    access_log  /var/log/nginx/devbelt.l2hi.access.log;
    error_log   /var/log/nginx/devbelt.l2hi.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    location = /health/ready {
        proxy_pass http://devbelt_db_server;
        access_log off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3s;
    }

    # catch-all：UI（/db、/login、/verify-email、/sync-reset）
    # 与 API（/api/auth、/api/console、/api/db）。
    location / {
        proxy_pass http://devbelt_db_server;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}