name: CI

on:
  # 专用 CI 分支：仅推送到 ci 触发；main 保持自身配置，其他分支/PR 不跑。
  push:
    branches: [ci]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 是下限（vitest 4 的 engines 是 ^20 || ^22 || >=24），22 是当前 LTS。
        # 之前这里写的是 [18, 20]，而 Node 18 上 vitest 装不起来 —— 那条腿的
        # Test 步骤从来没真正跑过测试。
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，
      # 而不是悄悄改 lockfile 装一套和本地不同的依赖。CI 必须装的是被审阅过
      # 的那份依赖树。
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # db-core 是发布到 npm 的产物：验证 pack 后入口/类型/子路径导出是否齐全
      # （漏 dist、exports 映射写错等只有真正 pack 才暴露）。放在 Build 之后。
      - name: Pack smoke (db-core)
        run: pnpm -C packages/db-core pack:smoke

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # vscode-ext 是市场发布版，打包配置出问题（漏文件、.vscodeignore 写错、
      # manifest 校验失败）原先要等到准备发布时才发现。vsce 会校验 entrypoint
      # 存在，所以必须放在 Build 之后 —— 实测删掉 out/ 后它会报
      # "Extension entrypoint(s) missing" 并失败。
      - name: Package extension
        run: pnpm -C apps/vscode-ext package
  # 需要真实数据库的测试。四个文件全是 describe.skipIf(!URL)，本地无库时
  # 整体跳过，所以 `pnpm test` 在任何机器上都能过 —— 代价是它们在 CI 里
  # 也从未跑过。这个 job 用 service container 把门禁打开。
  #
  # 单独一个 job 而不是塞进 build 的 matrix：build 跑两个 Node 版本，
  # 塞进去等于把数据库启动等待期付两遍，还会拖慢单测的反馈速度。
  integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          # mysqlSchema / mysqlReal 都硬编码库名 devbelt_db_verify，
          # 由 container 直接建好，测试自己不建库
          MYSQL_DATABASE: devbelt_db_verify
        ports:
          - 3306:3306
        # 没有 health check 的话测试会在 MySQL 还没起来时就连，随机失败
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-pg-pass
          POSTGRES_DB: devbelt_db_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      # P7：Redis 真实实例（无密码 + requirepass 两例），供 db-core Redis 集成测试。
      # 未设 DEVBELT_DB_TEST_REDIS_* 时测试整体 skip，本地无 Redis 也能过。
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # server 的集成测试 import src/**/*.js，需要先编译
      - name: Build
        run: pnpm build

      # 两个 URL 就是这些测试的门禁开关（未设置则 skipIf 整体跳过）。
      # 密码里没有特殊字符，但格式上仍按测试要求做百分号编码约定。
      # requirepass 实例不能用 services.options 传（`--requirepass` 会被当作 docker create
      # 标志，exit 125）——它在 docker create 里没有 command 位。改为 step 里 docker run。
      - name: Start Redis (requirepass)
        run: |
          docker run -d --name redis-auth -p 6380:6379 redis:7 redis-server --requirepass ci-redis-pass
          for i in $(seq 1 30); do
            docker exec redis-auth redis-cli -a ci-redis-pass ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done

      # TLS：自签 CA + 服务端证书（SAN IP=127.0.0.1），redis 仅开 tls-port。
      - name: Start Redis (TLS)
        run: |
          mkdir -p .ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout .ci-certs/ca.key -out .ci-certs/ca.crt -days 1 -subj "/CN=devbelt-ci-ca"
          openssl req -newkey rsa:2048 -nodes -keyout .ci-certs/redis.key -out .ci-certs/redis.csr -subj "/CN=127.0.0.1"
          openssl x509 -req -in .ci-certs/redis.csr -CA .ci-certs/ca.crt -CAkey .ci-certs/ca.key -CAcreateserial -out .ci-certs/redis.crt -days 1 -extfile <(printf "subjectAltName=IP:127.0.0.1")
          chmod 644 .ci-certs/*
          docker run -d --name redis-tls -p 6390:6390 -v "$PWD/.ci-certs:/tls:ro" redis:7 \
            redis-server --port 0 --tls-port 6390 \
            --tls-cert-file /tls/redis.crt --tls-key-file /tls/redis.key --tls-ca-cert-file /tls/ca.crt \
            --tls-auth-clients no
          for i in $(seq 1 30); do
            docker exec redis-tls redis-cli --tls --cacert /tls/ca.crt -p 6390 ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done

      - name: Integration tests (db-core)
        env:
          DEVBELT_DB_TEST_MYSQL_URL: mysql://root:ci-root-pass@127.0.0.1:3306
          # 服务容器建的库是 devbelt_db_verify；不设 DEVBELT_DB_TEST_MYSQL_DB 时测试默认 devbelt_db_verify → ER_BAD_DB_ERROR。
          DEVBELT_DB_TEST_MYSQL_DB: devbelt_db_verify
          DEVBELT_DB_TEST_PG_URL: postgres://postgres:ci-pg-pass@127.0.0.1:5432/devbelt_db_verify
          # P7：真实 Redis（standalone / requirepass / TLS 自签）。
          DEVBELT_DB_TEST_REDIS_URL: redis://127.0.0.1:6379
          DEVBELT_DB_TEST_REDIS_AUTH_URL: redis://:ci-redis-pass@127.0.0.1:6380
          DEVBELT_DB_TEST_REDIS_TLS_URL: rediss://127.0.0.1:6390
          DEVBELT_DB_TEST_REDIS_TLS_CA: ${{ github.workspace }}/.ci-certs/ca.crt
        run: pnpm -C packages/db-core test

      # Cluster：3 节点（host network，避免容器 IP 通告导致 natMap 不生效）。
      - name: Start Redis Cluster (3 nodes)
        run: |
          for p in 7000 7001 7002; do
            docker run -d --name redis-$p --network host redis:7 \
              redis-server --port $p --cluster-enabled yes --cluster-config-file /data/nodes-$p.conf \
              --cluster-node-timeout 5000 --appendonly no --save ""
          done
          for i in $(seq 1 30); do docker exec redis-7000 redis-cli -p 7000 ping 2>/dev/null | grep -q PONG && break; sleep 1; done
          docker exec redis-7000 redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-yes

      # Sentinel：监控既有 redis service（127.0.0.1:6379）。
      - name: Start Redis Sentinel
        run: |
          printf 'port 26379\nsentinel monitor mymaster 127.0.0.1 6379 1\nsentinel down-after-milliseconds mymaster 5000\nsentinel failover-timeout mymaster 10000\n' > /tmp/sentinel.conf
          docker run -d --name redis-sentinel --network host -v /tmp/sentinel.conf:/etc/sentinel.conf:ro redis:7 redis-server /etc/sentinel.conf --sentinel
          for i in $(seq 1 30); do docker exec redis-sentinel redis-cli -p 26379 ping 2>/dev/null | grep -q PONG && break; sleep 1; done

      # Cluster over SSH：硬门禁——真实验证 setupClusterOverSsh 的 natMap 路由（SSH+多节点才承重）。
      - name: Integration tests (vscode-ext cluster over SSH)
        env:
          DEVBELT_DB_TEST_REDIS_CLUSTER: 127.0.0.1:7000
        run: pnpm -C apps/vscode-ext exec vitest run test/integration/redisTopologyOverSsh.test.ts -t "Cluster over SSH"

      # Sentinel over SSH：best-effort（已知限制：SSH 路径为 standalone 连发现到的 master，
      # 不自动重发现）。失败不阻断（continue-on-error），结果记入 P7「已知限制」。
      - name: Integration tests (vscode-ext sentinel over SSH, best-effort)
        continue-on-error: true
        env:
          DEVBELT_DB_TEST_REDIS_SENTINEL: 127.0.0.1:26379
        run: pnpm -C apps/vscode-ext exec vitest run test/integration/redisTopologyOverSsh.test.ts -t "Sentinel over SSH"

      # SSH 隧道：进程内 ssh2 Server（支持 direct-tcpip）+ 真实 Redis；验证 SshTunnel。
      - name: Integration tests (vscode-ext SSH tunnel)
        env:
          DEVBELT_DB_TEST_REDIS_URL: redis://127.0.0.1:6379
        run: pnpm -C apps/vscode-ext exec vitest run test/integration/redisSshTunnel.test.ts

      - name: Integration tests (server)
        env:
          DEVBELT_DB_TEST_MYSQL_URL: mysql://root:ci-root-pass@127.0.0.1:3306
          DEVBELT_DB_TEST_MYSQL_DB: devbelt_db_verify
        run: pnpm -C apps/server test

  # 浏览器 e2e：注册/登录/邮箱验证全链路（Playwright + Mailpit 真发信 + 真实 MySQL）。
  # 独立 job：需要构建 server（bundle）+ db-ui（dist）+ 起服务 + 装浏览器，成本高，
  # 不塞进 build matrix。Mailpit SMTP sink（1025）收 server 真发的邮件，8025 提供 HTTP API 取信。
  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-pass
          MYSQL_DATABASE: devbelt_db_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e-root-pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mailpit:
        image: axllent/mailpit:v1.18
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # db-ui 构建经 auth-client 源码把 `@devbelt/db-host/*` 解析到 db-host 的 dist；
      # 全新 checkout 无 dist（gitignored），必须先建 db-core + db-host（同 vsix-smoke job）。
      - name: Build db-core + db-host + server + SPAs
        run: pnpm -C packages/db-core build && pnpm -C packages/db-host build && pnpm -C apps/server build && DEVBELT_DB_CONSOLE_BASE=/db/ pnpm -C apps/db-ui build && DEVBELT_DB_AUTH_BASE=/ pnpm -C apps/auth-ui build && DEVBELT_DB_ADMIN_BASE=/admin/ pnpm -C apps/admin-ui build

      - name: Prepare Ed25519 signing keys
        run: |
          openssl genpkey -algorithm ed25519 -out /tmp/k1.pem
          openssl pkey -in /tmp/k1.pem -pubout -out /tmp/k1.pub.pem
          echo "DEVBELT_DB_TOKEN_SIGNING_KEY_B64=$(base64 -w0 /tmp/k1.pem)" >> "$GITHUB_ENV"
          echo "DEVBELT_DB_TOKEN_VERIFY_KEYS_JSON={\"k1\":\"$(base64 -w0 /tmp/k1.pub.pem)\"}" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: pnpm -C apps/e2e exec playwright install --with-deps chromium

      - name: Run e2e
        env:
          NODE_ENV: development
          DEVBELT_DB_SMTP_BASE_URL: http://localhost:5173
          DEVBELT_DB_MAILER: mailpit
          DEVBELT_DB_MAILPIT_HOST: localhost
          DEVBELT_DB_MAILPIT_PORT: '1025'
          DEVBELT_DB_MAILPIT_HTTP: http://localhost:8025
          DEVBELT_DB_SMTP_FROM: no-reply@localhost.test
          DEVBELT_DB_MYSQL_HOST: 127.0.0.1
          DEVBELT_DB_MYSQL_PORT: '3306'
          DEVBELT_DB_MYSQL_USER: root
          DEVBELT_DB_MYSQL_PASSWORD: e2e-root-pass
          DEVBELT_DB_MYSQL_DATABASE: devbelt_db_e2e
          DEVBELT_DB_PORT: '5173'
          DEVBELT_DB_E2E_BASE_URL: http://localhost:5173
        run: pnpm -C apps/e2e e2e

  # VSIX 安装 smoke：真实 vsce 打包 → 真实安装 → 真实启动并断言扩展激活/命令注册。
  # 独立 job：需下载 VS Code（stable）与 xvfb（Linux 无显示），成本高，不塞进 build matrix。
  # 覆盖 .vscodeignore 漏文件、main 路径错、激活失败等只有真装才暴露的问题。
  vsix-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # 扩展 bundle（out/）+ webview dist 必须先就绪，vsce 才能打进 vsix。
      - name: Build extension
        run: pnpm -C packages/db-core build && pnpm -C packages/db-host build && pnpm -C apps/vscode-ext build

      - name: Run VSIX install smoke
        run: xvfb-run -a pnpm -C apps/vscode-ext vsix:smoke
