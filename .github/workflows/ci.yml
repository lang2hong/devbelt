name: CI

on:
  # 临时：仅 main 触发 CI，其他分支与 PR 一律不跑。恢复：把 branches 改回 ['**'] 并恢复 pull_request 段。
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 是下限（vitest 4 的 engines 是 ^20 || ^22 || >=24），22 是当前 LTS。
        # 之前这里写的是 [18, 20]，而 Node 18 上 vitest 装不起来 —— 那条腿的
        # Test 步骤从来没真正跑过测试。
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # --frozen-lockfile：lockfile 与 package.json 不一致时直接失败，
      # 而不是悄悄改 lockfile 装一套和本地不同的依赖。CI 必须装的是被审阅过
      # 的那份依赖树。
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # db-core 是发布到 npm 的产物：验证 pack 后入口/类型/子路径导出是否齐全
      # （漏 dist、exports 映射写错等只有真正 pack 才暴露）。放在 Build 之后。
      - name: Pack smoke (db-core)
        run: pnpm -C packages/db-core pack:smoke

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # vscode-ext 是市场发布版，打包配置出问题（漏文件、.vscodeignore 写错、
      # manifest 校验失败）原先要等到准备发布时才发现。vsce 会校验 entrypoint
      # 存在，所以必须放在 Build 之后 —— 实测删掉 out/ 后它会报
      # "Extension entrypoint(s) missing" 并失败。
      - name: Package extension
        run: pnpm -C packages/vscode-ext package
  # 需要真实数据库的测试。四个文件全是 describe.skipIf(!URL)，本地无库时
  # 整体跳过，所以 `pnpm test` 在任何机器上都能过 —— 代价是它们在 CI 里
  # 也从未跑过。这个 job 用 service container 把门禁打开。
  #
  # 单独一个 job 而不是塞进 build 的 matrix：build 跑两个 Node 版本，
  # 塞进去等于把数据库启动等待期付两遍，还会拖慢单测的反馈速度。
  integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pass
          # mysqlSchema / mysqlReal 都硬编码库名 dbclient_verify，
          # 由 container 直接建好，测试自己不建库
          MYSQL_DATABASE: dbclient_verify
        ports:
          - 3306:3306
        # 没有 health check 的话测试会在 MySQL 还没起来时就连，随机失败
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-pg-pass
          POSTGRES_DB: dbclient_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # server 的集成测试 import src/**/*.js，需要先编译
      - name: Build
        run: pnpm build

      # 两个 URL 就是这些测试的门禁开关（未设置则 skipIf 整体跳过）。
      # 密码里没有特殊字符，但格式上仍按测试要求做百分号编码约定。
      - name: Integration tests (db-core)
        env:
          MYSQL_TEST_URL: mysql://root:ci-root-pass@127.0.0.1:3306
          PG_TEST_URL: postgres://postgres:ci-pg-pass@127.0.0.1:5432/dbclient_verify
        run: pnpm -C packages/db-core test

      - name: Integration tests (server)
        env:
          MYSQL_TEST_URL: mysql://root:ci-root-pass@127.0.0.1:3306
        run: pnpm -C packages/server test

  # 浏览器 e2e：注册/登录/邮箱验证/邀请全链路（Playwright + Mailpit 真发信 + 真实 MySQL）。
  # 独立 job：需要构建 server（bundle）+ console-ui（dist）+ 起服务 + 装浏览器，成本高，
  # 不塞进 build matrix。Mailpit SMTP sink（1025）收 server 真发的邮件，8025 提供 HTTP API 取信。
  e2e:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: e2e-root-pass
          MYSQL_DATABASE: dbclient_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pe2e-root-pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      mailpit:
        image: axllent/mailpit:v1.18
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build server + console-ui
        run: pnpm -C packages/server build && pnpm -C packages/console-ui build

      - name: Prepare Ed25519 signing keys
        run: |
          openssl genpkey -algorithm ed25519 -out /tmp/k1.pem
          openssl pkey -in /tmp/k1.pem -pubout -out /tmp/k1.pub.pem
          echo "TOKEN_SIGNING_KEY_B64=$(base64 -w0 /tmp/k1.pem)" >> "$GITHUB_ENV"
          echo "TOKEN_VERIFY_KEYS_JSON={\"k1\":\"$(base64 -w0 /tmp/k1.pub.pem)\"}" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: pnpm -C packages/e2e exec playwright install --with-deps chromium

      - name: Run e2e
        env:
          NODE_ENV: development
          SMTP_BASE_URL: http://localhost:5173
          MAILER: mailpit
          MAILPIT_HOST: localhost
          MAILPIT_PORT: '1025'
          MAILPIT_HTTP: http://localhost:8025
          SMTP_FROM: no-reply@localhost.test
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: e2e-root-pass
          MYSQL_DATABASE: dbclient_e2e
          PORT: '5173'
          E2E_BASE_URL: http://localhost:5173
        run: pnpm -C packages/e2e e2e

  # VSIX 安装 smoke：真实 vsce 打包 → 真实安装 → 真实启动并断言扩展激活/命令注册。
  # 独立 job：需下载 VS Code（stable）与 xvfb（Linux 无显示），成本高，不塞进 build matrix。
  # 覆盖 .vscodeignore 漏文件、main 路径错、激活失败等只有真装才暴露的问题。
  vsix-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # 扩展 bundle（out/）+ webview dist 必须先就绪，vsce 才能打进 vsix。
      - name: Build extension
        run: pnpm -C packages/db-core build && pnpm -C packages/vscode-ext build

      - name: Run VSIX install smoke
        run: xvfb-run -a pnpm -C packages/vscode-ext vsix:smoke
