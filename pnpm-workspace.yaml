packages:
  - apps/*
  - packages/*

# 安装脚本允许名单（唯一来源）。pnpm 版本由根 package.json 的 packageManager 锁定
# （CI 的 pnpm/action-setup 与本地 corepack 都读取它），该版本读取本字段。
# 未列出的依赖默认不允许执行 install 脚本（cpu-features/keytar/ssh2）。
# 无安装脚本的依赖无需列出；此处只列确有脚本、且允许的包。
allowBuilds:
  '@vscode/vsce-sign': true
  cpu-features: false
  esbuild: true
  keytar: false
  ssh2: false
  vue-demi: true