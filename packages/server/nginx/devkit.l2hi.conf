# devkit.l2hi.com —— 开发者套件（单部署单库）。
#
# 当前（P1）server 仍托管全部 UI（身份页 /login、控制台 /console 等）与 /api/*，
# 因此根路径整体反代到 :3000；P2 拆分前端（auth-ui 根、console /db、admin /admin）后，
# 再由 nginx 直接托管各 SPA 静态、仅 /api/ 反代。
#
# 应用：sudo cp 到 /etc/nginx/l2hi/devkit.l2hi.conf 后 nginx -t && systemctl reload nginx。
# 证书：需含 devkit.l2hi.com（单域证书或通配 *.l2hi.com / *.devkit.l2hi.com）。

upstream devkit_server {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name devkit.l2hi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/l2h/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name devkit.l2hi.com;

    ssl_certificate     /root/.acme.sh/devkit.l2hi.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/devkit.l2hi.com_ecc/devkit.l2hi.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;
    server_tokens off;

    access_log  /var/log/nginx/devkit.l2hi.access.log;
    error_log   /var/log/nginx/devkit.l2hi.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location / {
        proxy_pass http://devkit_server;
    }

    location = /health/ready {
        proxy_pass http://devkit_server;
        access_log off;
    }
}