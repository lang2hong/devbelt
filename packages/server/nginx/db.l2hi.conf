# db.l2hi.com —— 已弃用，301 到 devkit.l2hi.com（应用迁至 devkit）。
#
# 应用：覆盖服务器上的 /etc/nginx/l2hi/db.l2hi.conf 后 nginx -t && systemctl reload nginx。
# 证书沿用现有 l2hi.com 证书（SAN 已含 db.l2hi.com）；过渡期结束后可整体移除本文件与 DNS。

server {
    listen 80;
    server_name db.l2hi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/l2h/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name db.l2hi.com;

    ssl_certificate     /root/.acme.sh/l2hi.com_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/l2hi.com_ecc/l2hi.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    access_log  /var/log/nginx/db.l2hi.access.log;
    error_log   /var/log/l2hi/db.l2hi.error.log warn;

    # 弃用：全部 301 到新域（保留路径与查询串）。
    location / {
        return 301 https://devkit.l2hi.com$request_uri;
    }
}