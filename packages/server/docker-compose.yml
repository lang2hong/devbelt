version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dbclient-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: db_client
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    container_name: dbclient-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: dbclient
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: db_client
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      PORT: 3000
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  mysql-data: