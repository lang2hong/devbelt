version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: dbclient-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: db_client
      # server 以 dbclient 身份连接，必须让镜像把这个用户创建出来，
      # 否则启动即认证失败。官方镜像会自动授予该用户 MYSQL_DATABASE 的全部权限，
      # 因此 ensureDatabase() 也不再需要建库权限。
      # 注意：仅在首次初始化空数据目录时生效，已有 mysql-data 卷需手工建用户，
      # 见 README「启动」小节。
      MYSQL_USER: dbclient
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    container_name: dbclient-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: dbclient
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_DATABASE: db_client
      # 刻意不给默认值：Dockerfile 设了 NODE_ENV=production，而一个默认值会让
      # process.env.JWT_SECRET 恒非空，把 config.ts 里「生产必填」的检查绕过去 ——
      # 服务就会用仓库里公开可见的字符串签发 token。`:?` 让缺失在 compose 阶段
      # 就失败，而不是留到运行时变成一个可伪造 admin token 的线上服务。
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (openssl rand -base64 48)}
      PORT: 3000
    ports:
      - "3000:3000"
    env_file:
      - .env

volumes:
  mysql-data: